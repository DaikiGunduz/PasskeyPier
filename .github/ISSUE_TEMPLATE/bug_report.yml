name: Bug report
description: A ceremony produced a wrong verdict, or the tool crashed
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What the tool did, and what you expected the ceremony to decide.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The command, the scenario file (or a minimal excerpt), and the output.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you built from, or the release tag.
